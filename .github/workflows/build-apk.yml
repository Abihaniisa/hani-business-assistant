name: Build Hani Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35,build-tools;35.0.0

      - name: Restore permanent signing key
        env:
          HANI_KEYSTORE_BASE64: ${{ secrets.HANI_KEYSTORE_BASE64 }}
        run: |
          test -n "$HANI_KEYSTORE_BASE64"
          echo "$HANI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hani-upload.jks"
          echo "HANI_KEYSTORE_PATH=$RUNNER_TEMP/hani-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          HANI_KEYSTORE_PASSWORD: ${{ secrets.HANI_KEYSTORE_PASSWORD }}
          HANI_KEY_PASSWORD: ${{ secrets.HANI_KEY_PASSWORD }}
          HANI_KEY_ALIAS: ${{ secrets.HANI_KEY_ALIAS }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hani-business-assistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
